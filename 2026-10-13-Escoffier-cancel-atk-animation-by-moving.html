<h1>爱可菲移取</h1>
<p>移动取消普攻后摇，原神里面的很多角色都有这个特质，反正单手剑和长枪都很容易卡</p>
<p>原理大概是进行第一段普攻之后立刻按移动键，就会打断普攻状态，从而使下一次普攻仍然从第一段普攻开始<br>
所以手法大概就是在鼠标点按进行普攻之后马上点按移动键 wasd ，然后重复这个过程<br>
熟练之后可以非常快地打出第一段普攻伤害</p>
<p>但是实战中仍然会受到卡肉的影响，手感需要重新适应</p>
